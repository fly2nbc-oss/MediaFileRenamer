name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install vcpkg
        id: vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "e0edebd1dc2d03cf7d02349df91de74ef4d0c00e"

      - name: Install libheif via vcpkg
        run: vcpkg install libheif:x64-windows-static-md

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri (Windows)
        run: npm run tauri build
        env:
          CI: "true"

      - name: Upload Windows EXE (standalone, no installer)
        uses: actions/upload-artifact@v6
        with:
          name: media-file-renamer-windows-exe
          path: src-tauri/target/release/media-file-renamer.exe

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v6
        with:
          name: media-file-renamer-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: Upload Windows NSIS
        uses: actions/upload-artifact@v6
        if: success()
        with:
          name: media-file-renamer-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libheif-dev

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri (Linux)
        run: npm run tauri build
        env:
          CI: "true"
          NO_STRIP: "1"

      - name: Upload Linux executable (standalone, no installer)
        uses: actions/upload-artifact@v6
        with:
          name: media-file-renamer-linux-standalone
          path: src-tauri/target/release/media-file-renamer

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v6
        if: success()
        with:
          name: media-file-renamer-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload Linux deb
        uses: actions/upload-artifact@v6
        if: success()
        with:
          name: media-file-renamer-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: media-file-renamer-windows-exe
          path: release-windows-exe
      - name: Download Windows MSI
        uses: actions/download-artifact@v4
        with:
          name: media-file-renamer-windows-msi
          path: release-windows-msi
      - name: Download Windows NSIS
        uses: actions/download-artifact@v4
        with:
          name: media-file-renamer-windows-nsis
          path: release-windows-nsis
      - name: Download Linux standalone
        uses: actions/download-artifact@v4
        with:
          name: media-file-renamer-linux-standalone
          path: release-linux
      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: media-file-renamer-linux-appimage
          path: release-linux-appimage
      - name: Download Linux deb
        uses: actions/download-artifact@v4
        with:
          name: media-file-renamer-linux-deb
          path: release-linux-deb
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-windows-exe/*
            release-windows-msi/*
            release-windows-nsis/*
            release-linux/*
            release-linux-appimage/*
            release-linux-deb/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
